spring.application.name=service-requests-api

# --- Database: H2 in-memory (fixed name so the H2 console can connect) ---
spring.datasource.url=jdbc:h2:mem:servicerequests
spring.datasource.username=sa
spring.datasource.password=

# Browser UI at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:servicerequests)
spring.h2.console.enabled=true

# --- JPA / Hibernate ---
# Generate tables from entities on startup, drop on shutdown. Dev only; real apps use Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=create-drop
# Close the DB session when the transaction ends (no hidden queries during JSON writing).
spring.jpa.open-in-view=false

# --- Logging: show the SQL Hibernate generates (great for learning) ---
logging.level.org.hibernate.SQL=debug
